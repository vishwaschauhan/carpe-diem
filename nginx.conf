server {
  listen ${PORT};
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Hashed bundles never change: cache for a year.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  # The page and service worker must revalidate so new deploys arrive.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
